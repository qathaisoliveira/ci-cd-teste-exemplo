name: Teste CI - Cypress

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Instalar dependências
      run: npm install

    - name: Executar testes do Cypress
      run: npm test
      continue-on-error: true # Importante caso queira que o relatório seja gerado mesmo se houver testes falhados (como o teste do 4 vs 2)

    - name: Gerar relatório Allure
      run: npx allure generate allure-results --clean -o allure-report

    - name: Publicar relatório no Gh Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report